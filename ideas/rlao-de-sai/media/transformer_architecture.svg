<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
    .label { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
    .title { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #000; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .block-bg { fill: #f0f4f8; stroke: #ccc; stroke-width: 1; rx: 8; ry: 8; }
    .sub-block { fill: #e1e8ed; stroke: #333; stroke-width: 1.5; rx: 4; ry: 4; }
    .norm-layer { fill: #fff3c4; stroke: #333; stroke-width: 1.5; rx: 4; ry: 4; }
  </style>
  <defs>
    <!-- Made arrow smaller as requested -->
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Titles -->
  <text x="200" y="40" class="title">编码器 (Encoder)</text>
  <text x="500" y="40" class="title">解码器 (Decoder)</text>

  <!-- ==================== ENCODER (Left) ==================== -->

  <!-- Main Background Box for Encoder (Shifted down to y=120) -->
  <rect x="100" y="120" width="200" height="580" class="block-bg" />

  <!-- Inputs -->
  <rect x="140" y="650" width="120" height="35" class="box" fill="#ffcccc" />
  <text x="200" y="672" class="label">输入 (Inputs)</text>
  <path d="M 200 650 L 200 635" class="arrow" />

  <!-- Input Embedding -->
  <rect x="140" y="600" width="120" height="35" class="box" />
  <text x="200" y="622" class="label">输入嵌入</text>

  <!-- Positional Encoding Addition -->
  <path d="M 200 600 L 200 585" class="arrow" />
  <circle cx="200" cy="570" r="15" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="200" y="575" class="label" style="font-size: 18px;">+</text>
  <text x="240" y="575" class="label" style="text-anchor: start; font-size: 12px;">位置编码</text>
  <path d="M 200 555 L 200 535" class="arrow" />

  <!-- Encoder Stack (Nx Box) -->
  <rect x="115" y="200" width="170" height="340" fill="none" stroke="#666" stroke-dasharray="8,5" />
  <text x="95" y="370" class="label" style="writing-mode: tb; font-weight: bold;">Nx</text>

  <!-- Layer 1: Self Attention -->
  <rect x="140" y="490" width="120" height="45" class="sub-block" fill="#dcedc8" />
  <text x="200" y="517" class="label">多头注意力</text>
  <path d="M 200 490 L 200 475" class="arrow" />

  <!-- Layer 2: Add & Norm -->
  <rect x="140" y="440" width="120" height="30" class="norm-layer" />
  <text x="200" y="460" class="label" style="font-size: 12px;">残差 &amp; 归一化</text>
  <path d="M 200 440 L 200 405" class="arrow" /> <!-- Long arrow to next block -->

  <!-- Layer 3: Feed Forward -->
  <rect x="140" y="360" width="120" height="45" class="sub-block" fill="#b3e5fc" />
  <text x="200" y="387" class="label">前馈网络</text>
  <path d="M 200 360 L 200 345" class="arrow" />

  <!-- Layer 4: Add & Norm -->
  <rect x="140" y="310" width="120" height="30" class="norm-layer" />
  <text x="200" y="330" class="label" style="font-size: 12px;">残差 &amp; 归一化</text>

  <!-- Output of Encoder Stack -->
  <path d="M 200 310 L 200 280" class="arrow" stroke="#555" />

  <!-- ==================== DECODER (Right) ==================== -->

  <!-- Main Background Box for Decoder (Shifted down to y=120) -->
  <rect x="400" y="120" width="200" height="580" class="block-bg" />

  <!-- Outputs (Shifted) -->
  <rect x="440" y="650" width="120" height="35" class="box" fill="#ffcccc" />
  <text x="500" y="672" class="label">输出 (右移)</text>
  <path d="M 500 650 L 500 635" class="arrow" />

  <!-- Output Embedding -->
  <rect x="440" y="600" width="120" height="35" class="box" />
  <text x="500" y="622" class="label">输出嵌入</text>

  <!-- Positional Encoding Addition -->
  <path d="M 500 600 L 500 585" class="arrow" />
  <circle cx="500" cy="570" r="15" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="500" y="575" class="label" style="font-size: 18px;">+</text>
  <path d="M 500 555 L 500 535" class="arrow" />

  <!-- Decoder Stack (Nx Box) -->
  <rect x="415" y="200" width="170" height="340" fill="none" stroke="#666" stroke-dasharray="8,5" />
  <text x="595" y="370" class="label" style="writing-mode: tb; font-weight: bold;">Nx</text>

  <!-- Layer 1: Masked Self Attention -->
  <rect x="440" y="490" width="120" height="45" class="sub-block" fill="#dcedc8" />
  <text x="500" y="512" class="label" style="font-size: 12px;">掩码多头</text>
  <text x="500" y="528" class="label" style="font-size: 12px;">注意力</text>
  <path d="M 500 490 L 500 475" class="arrow" />

  <!-- Layer 2: Add & Norm -->
  <rect x="440" y="440" width="120" height="30" class="norm-layer" />
  <text x="500" y="460" class="label" style="font-size: 12px;">残差 &amp; 归一化</text>
  <path d="M 500 440 L 500 425" class="arrow" />

  <!-- Layer 3: Cross Attention -->
  <rect x="440" y="380" width="120" height="45" class="sub-block" fill="#ffccbc" />
  <text x="500" y="407" class="label">交叉注意力</text>
  <path d="M 500 380 L 500 365" class="arrow" />

  <!-- Layer 4: Add & Norm -->
  <rect x="440" y="330" width="120" height="30" class="norm-layer" />
  <text x="500" y="350" class="label" style="font-size: 12px;">残差 &amp; 归一化</text>
  <path d="M 500 330 L 500 315" class="arrow" />

  <!-- Layer 5: Feed Forward -->
  <rect x="440" y="270" width="120" height="45" class="sub-block" fill="#b3e5fc" />
  <text x="500" y="297" class="label">前馈网络</text>
  <path d="M 500 270 L 500 255" class="arrow" />

  <!-- Layer 6: Add & Norm -->
  <rect x="440" y="220" width="120" height="30" class="norm-layer" />
  <text x="500" y="240" class="label" style="font-size: 12px;">残差 &amp; 归一化</text>
  <path d="M 500 220 L 500 205" class="arrow" />

  <!-- ==================== CROSS CONNECTION ==================== -->
  <!-- Connection from Encoder to Decoder (Cross Attn) -->
  <!-- Enc Top Path starts at y=280 (was 230). Target y=402 (Cross Attn centerish) -->
  <!-- Cross Attn top y=380. Input point is left side of block, y=402.5. -->
  <polyline points="200,280 200,260 360,260 360,402 440,402"
            fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />


  <!-- ==================== OUTPUTS ==================== -->

  <!-- Linear -->
  <rect x="440" y="175" width="120" height="25" class="box" />
  <text x="500" y="192" class="label" style="font-size: 12px;">线性层 (Linear)</text>
  <path d="M 500 175 L 500 160" class="arrow" />

  <!-- Softmax -->
  <rect x="440" y="130" width="120" height="25" class="box" fill="#c8e6c9" />
  <text x="500" y="147" class="label" style="font-size: 12px;">Softmax</text>
  <path d="M 500 130 L 500 115" class="arrow" /> <!-- Arrow to Prob Text -->

  <!-- Probabilities -->
  <!-- Text at y=100. Arrow tip at 115. Gap 15px. -->
  <text x="500" y="100" class="label" style="font-weight: bold;">输出概率</text>

</svg>
