<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for a premium, high-tech look -->
    <linearGradient id="primary_grad" x1="20" y1="108" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9" /> <!-- Sky Blue -->
      <stop offset="1" stop-color="#10b981" /> <!-- Emerald Green -->
    </linearGradient>
    <linearGradient id="accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- Gold -->
      <stop offset="100%" stop-color="#f59e0b" /> <!-- Amber -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle (Subtle) -->
  <circle cx="64" cy="64" r="60" fill="url(#primary_grad)" fill-opacity="0.1" />

  <!-- 1. The Neural Structure (Representing the Agent/Policy) -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Connections -->
    <line x1="-20" y1="15" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="15" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>

    <!-- Nodes -->
    <circle cx="0" cy="-20" r="5" fill="#0ea5e9" /> <!-- State (Blue) -->
    <circle cx="-20" cy="15" r="5" fill="#10b981" /> <!-- Action (Green) -->
    <circle cx="20" cy="15" r="5" fill="#fbbf24" /> <!-- Value/Reward (Gold) -->
  </g>

  <!-- 2. The Feedback Loop (The "Reinforcement" Cycle) -->
  <!-- A dynamic swooshing arrow encircling the agent -->
  <path d="M 64 16 A 48 48 0 0 1 105.5 88" stroke="url(#primary_grad)" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 22.5 40 A 48 48 0 0 1 64 16" stroke="url(#primary_grad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" fill="none" />

  <!-- Arrow Head -->
  <path d="M 105.5 88 L 112 78 L 98 80 Z" fill="#10b981" transform="rotate(10 105.5 88)" />

  <!-- 3. The "Optimal Policy" Spark (Glitter) -->
  <!-- Symbolizing the discovery of the optimal path -->
  <path d="M 90 35 L 92 31 L 96 30 L 92 29 L 90 25 L 88 29 L 84 30 L 88 31 Z" fill="#fbbf24" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" duration="3s" repeatCount="indefinite" />
  </path>
</svg>
