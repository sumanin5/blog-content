<svg width="900" height="700" viewBox="0 0 900 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle grid -->
  <rect width="900" height="700" rx="16" fill="#0F172A"/>
  <path d="M0 50 H900 M0 150 H900 M0 250 H900 M0 350 H900 M0 450 H900 M0 550 H900 M0 650 H900" stroke="#1E293B" stroke-width="1"/>
  <path d="M50 0 V700 M150 0 V700 M250 0 V700 M350 0 V700 M450 0 V700 M550 0 V700 M650 0 V700 M750 0 V700 M850 0 V700" stroke="#1E293B" stroke-width="1"/>

  <!-- Title Area -->
  <rect x="250" y="20" width="400" height="40" rx="20" fill="#1E293B" stroke="#334155"/>
  <text x="450" y="48" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">THE BITTER LESSON: 范式博弈</text>

  <!-- Left Panel: Human Knowledge -->
  <g transform="translate(40, 80)">
    <rect width="380" height="300" rx="12" fill="#1E293B" fill-opacity="0.8" stroke="#F59E0B" stroke-width="2"/>
    <text x="190" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F59E0B" text-anchor="middle">❌ 人类知识路径</text>
    <g transform="translate(145, 55) scale(0.8)">
      <circle cx="50" cy="50" r="40" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2" fill="#F59E0B" fill-opacity="0.1"/>
      <path d="M50 30 L50 70 M30 50 L70 50" stroke="#F59E0B" stroke-width="4"/>
      <rect x="40" y="40" width="20" height="20" fill="#F59E0B"/>
    </g>
    <text x="30" y="160" font-family="sans-serif" font-size="14" fill="#94A3B8">👉 <tspan fill="#E2E8F0" font-weight="bold">核心依赖</tspan>: 人类的直觉、专家规则</text>
    <text x="30" y="190" font-family="sans-serif" font-size="14" fill="#94A3B8">📉 <tspan fill="#E2E8F0" font-weight="bold">主要缺陷</tspan>: </text>
    <text x="50" y="215" font-family="sans-serif" font-size="13" fill="#94A3B8">1. 系统极度复杂，难以调试</text>
    <text x="50" y="240" font-family="sans-serif" font-size="13" fill="#94A3B8">2. 随着时间推移，性能遭遇瓶颈</text>
    <text x="50" y="265" font-family="sans-serif" font-size="13" fill="#94A3B8">3. "高原效应"，无法享受算力红利</text>
  </g>

  <!-- Right Panel: Computation Driven -->
  <g transform="translate(480, 80)">
    <rect width="380" height="300" rx="12" fill="#1E293B" fill-opacity="0.8" stroke="#10B981" stroke-width="2"/>
    <text x="190" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#10B981" text-anchor="middle">✅ 计算驱动路径</text>
    <g transform="translate(145, 55) scale(0.8)">
      <circle cx="50" cy="50" r="45" stroke="#10B981" stroke-width="1" fill="#10B981" fill-opacity="0.1"/>
      <circle cx="50" cy="20" r="4" fill="#10B981"/>
      <circle cx="20" cy="80" r="4" fill="#10B981"/>
      <circle cx="80" cy="80" r="4" fill="#10B981"/>
      <circle cx="50" cy="50" r="6" fill="#34D399"><animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/></circle>
      <path d="M50 20 L20 80 L80 80 Z" stroke="#10B981" stroke-width="1" opacity="0.6"/>
      <path d="M50 20 L50 50 M20 80 L50 50 M80 80 L50 50" stroke="#10B981" stroke-width="1"/>
    </g>
    <text x="30" y="160" font-family="sans-serif" font-size="14" fill="#94A3B8">🚀 <tspan fill="#E2E8F0" font-weight="bold">两大法宝</tspan>: 搜索 (Search) + 学习 (Learning)</text>
    <text x="30" y="190" font-family="sans-serif" font-size="14" fill="#94A3B8">📈 <tspan fill="#E2E8F0" font-weight="bold">长期优势</tspan>: </text>
    <text x="50" y="215" font-family="sans-serif" font-size="13" fill="#94A3B8">1. 完美契合摩尔定律 (Moore's Law)</text>
    <text x="50" y="240" font-family="sans-serif" font-size="13" fill="#94A3B8">2. 性能随算力呈指数级增长</text>
    <text x="50" y="265" font-family="sans-serif" font-size="13" fill="#94A3B8">3. 不受人类认知偏见的限制</text>
  </g>

  <!-- Bottom Area -->
  <g transform="translate(40, 460)">
    <line x1="0" y1="-30" x2="820" y2="-30" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="0" y="10" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">时间轴上的性能对比演变 ➔</text>

    <line x1="200" y1="180" x2="820" y2="180" stroke="#475569" stroke-width="2"/>

    <!-- Human Line -->
    <path d="M200 180 C 260 110, 350 100, 500 100 L 820 100" stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="5 5"/>
    <text x="210" y="130" font-family="sans-serif" font-size="12" fill="#F59E0B">早期优势</text>

    <!-- Compute Line -->
    <path d="M200 180 C 400 180, 560 120, 820 0" stroke="#10B981" stroke-width="4" fill="none"/>
    <text x="750" y="-10" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981">最终超越</text>

    <!-- Crossover Marker -->
    <circle cx="610" cy="100" r="5" fill="#EF4444"/>
    <text x="620" y="120" font-family="sans-serif" font-size="12" fill="#94A3B8">转折点</text>
  </g>
</svg>
